<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiniCPM</title>
<script>
  // Resolve the theme before first paint so dark mode never flashes light.
  (() => {
    let t = new URLSearchParams(location.search).get('theme');
    try { t ||= localStorage.getItem('minicpm.theme'); } catch {}
    if (!t || t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
/* ---------- Tokens: 青瓷 (model) / 墨 (you) / 朱砂 (on air) ---------- */
:root{
  color-scheme:light;
  --chrome:#F1F3EE; --surface:#FAFBF8; --raised:#FFFFFF; --sunken:#EBEEE8;
  --ink:#17211D; --ink-2:#47544E; --ink-3:#63706A;
  --line:#DFE3DB; --line-2:#C5CCC3;
  --jade:#0B6E5B; --jade-wave:#12A383; --jade-soft:#DCEDE6; --on-jade:#FFFFFF;
  --cinnabar:#C2351B; --cinnabar-soft:#FAE5DD; --on-cinnabar:#FFFFFF;
  --amber:#855600; --amber-soft:#F6EBD3;
  --you-wave:#2C3833; --user-bubble:#E9EDE6; --overlap:#C2351B22;
  --shadow:0 1px 2px #17211D0F,0 8px 28px #17211D14;
  --font:'Sarasa UI SC','PingFang SC','HarmonyOS Sans SC','MiSans','Noto Sans CJK SC','Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif;
  --mono:'JetBrains Mono','Sarasa Mono SC',ui-monospace,'SF Mono',Consolas,monospace;
  --nav-w:264px; --thread:760px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
:root[data-theme=dark]{
  color-scheme:dark;
  --chrome:#0F1412; --surface:#141A18; --raised:#1B2320; --sunken:#0B0F0D;
  --ink:#E8EDE8; --ink-2:#B1BCB5; --ink-3:#8E9A93;
  --line:#28322E; --line-2:#3C4843;
  --jade:#5ADBB8; --jade-wave:#3FD0AA; --jade-soft:#14332A; --on-jade:#06231B;
  --cinnabar:#FF8466; --cinnabar-soft:#3B1C15; --on-cinnabar:#2B0C05;
  --amber:#E9BE6C; --amber-soft:#35290F;
  --you-wave:#D5DDD7; --user-bubble:#212A27; --overlap:#FF846628;
  --shadow:0 1px 2px #0006,0 10px 32px #0008;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed}
h1,h2,h3,p{margin:0}
kbd{font:11px var(--mono);color:var(--ink-3)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:6px}
::selection{background:var(--jade-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;color:var(--ink-2);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn[aria-pressed=true],.icon-btn[aria-expanded=true]{background:var(--jade-soft);color:var(--jade)}
.btn{min-height:34px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid var(--line-2);background:var(--raised);font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.88}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;background:var(--sunken);color:var(--ink-2);font-size:12px;white-space:nowrap}
.pill.ok{background:var(--jade-soft);color:var(--jade)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--cinnabar-soft);color:var(--cinnabar)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--jade-wave)}.dot.bad{background:var(--cinnabar)}.dot.warn{background:var(--amber)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);height:100dvh;position:relative}
.app.nav-collapsed{--nav-w:0px}
.app.nav-collapsed .nav{visibility:hidden}
.nav{grid-column:1;grid-row:1}.work{grid-column:2;grid-row:1}.inspector{grid-column:3;grid-row:1}
.scrim{display:none}

/* ---------- Task navigation ---------- */
.nav{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--chrome);border-right:1px solid var(--line);padding:0 10px 8px;-webkit-app-region:no-drag}
.nav-top{height:52px;display:flex;align-items:center;gap:8px;padding:0 4px 0 6px;flex:none;-webkit-app-region:drag}
.nav-top button{-webkit-app-region:no-drag}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:.01em;flex:1;min-width:0}
.brand svg{width:22px;height:22px;fill:none;stroke-width:2.2;stroke-linecap:round}
.brand .a{stroke:var(--ink)}.brand .b{stroke:var(--jade-wave)}
.nav-new{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:8px;font-weight:500;border:1px solid var(--line-2);background:var(--raised);transition:background .15s}
.nav-new:hover{background:var(--sunken)}
.nav-new kbd{margin-left:auto}
.nav-search{display:flex;align-items:center;gap:8px;min-height:34px;margin-top:8px;padding:0 10px;border-radius:8px;color:var(--ink-3)}
.nav-search:focus-within{background:var(--raised);box-shadow:0 0 0 2px var(--jade)}
.nav-search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink)}
.nav-search input::placeholder{color:var(--ink-3)}
.nav-search input::-webkit-search-cancel-button{display:none}
.nav-list{flex:1;min-height:0;overflow-y:auto;margin:6px -4px 0;padding:0 4px 8px}
.nav-group{padding:12px 10px 4px;font-size:12px;color:var(--ink-3)}
.task{position:relative;display:block;border-radius:8px}
.task-main{display:block;width:100%;text-align:left;padding:7px 30px 7px 10px;border-radius:8px;transition:background .12s}
.task-main:hover{background:var(--sunken)}
.task.current .task-main{background:var(--raised);box-shadow:0 0 0 1px var(--line)}
.task-title{display:flex;align-items:center;gap:6px;min-width:0}
.task-title b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-meta{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-more{position:absolute;right:3px;top:6px;width:28px;height:28px;opacity:0}
.task:hover .task-more,.task-more:focus-visible,.task-more[aria-expanded=true]{opacity:1}
.task-flag{flex:none}
.task-flag.live{width:8px;height:8px;border-radius:50%;background:var(--cinnabar);animation:lamp 1.6s ease-in-out infinite}
.task-flag.busy{width:12px;height:12px;border:2px solid var(--line-2);border-top-color:var(--jade);border-radius:50%;animation:spin .9s linear infinite}
.task-flag.unread{width:7px;height:7px;border-radius:50%;background:var(--jade-wave)}
.task-flag.sched svg{width:14px;height:14px;color:var(--ink-3);display:block}
.nav-empty{padding:18px 10px;color:var(--ink-3);font-size:13px}
.nav-foot{position:relative;padding-top:6px;border-top:1px solid var(--line)}
.nav-foot>.icon-btn{position:absolute;right:2px;top:9px}
.engine{display:block;width:100%;text-align:left;padding:6px 8px 8px;border-radius:8px}
.engine:hover,.engine[aria-expanded=true]{background:var(--sunken)}
.eng-id{display:flex;align-items:center;gap:9px;min-width:0;padding-right:32px}
.eng-id b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eng-id small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:grid;grid-template-columns:auto minmax(24px,1fr) auto;align-items:center;gap:3px 8px;margin-top:7px;font-size:12px;color:var(--ink-2)}
.meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:2px;background:var(--ink-3);transition:width .6s var(--ease),background .2s}
.meter i.warn{background:var(--amber)}.meter i.bad{background:var(--cinnabar)}
.meters .word{white-space:nowrap;color:var(--ink)}
.res-note{margin-top:6px;font-size:12px;line-height:1.45;color:var(--ink-3)}
.nav-resizer{position:absolute;top:0;bottom:0;right:-4px;width:8px;cursor:col-resize;z-index:6;touch-action:none}
.nav-resizer::after{content:'';position:absolute;left:3px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
.nav-resizer:hover::after,.nav-resizer:focus-visible::after,.nav-resizer.drag::after{background:var(--jade)}
.nav-resizer:focus-visible{outline:0}

/* ---------- Workspace ---------- */
.work{min-width:0;display:flex;flex-direction:column;background:var(--surface)}
.head{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px 0 16px;border-bottom:1px solid transparent;-webkit-app-region:drag}
.head>*{-webkit-app-region:no-drag}
.head.scrolled{border-bottom-color:var(--line)}
.head-title{min-width:0;max-width:min(48ch,50%);font-weight:600;font-size:15px;padding:3px 6px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.head-title:hover{background:var(--sunken)}
.head-rename{min-width:0;width:min(42ch,50%);font-weight:600;font-size:15px;padding:2px 5px;border:1px solid var(--jade);border-radius:6px;background:var(--raised);outline:0}
.scene-chip{display:inline-flex;align-items:center;gap:3px;height:26px;padding:0 6px 0 9px;border-radius:7px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.scene-chip:hover{background:var(--sunken)}
.scene-chip svg{width:14px;height:14px}
.head-gap{flex:1;-webkit-app-region:drag}
.proto-chip{height:26px;padding:0 9px;border-radius:7px;border:1px dashed var(--line-2);color:var(--ink-3);font-size:12px}
.proto-chip:hover,.proto-chip[aria-expanded=true]{color:var(--ink);border-color:var(--ink-3)}
.only-collapsed{display:none}
.nav-collapsed .only-collapsed{display:inline-grid}

/* Call continues when the user looks at another task */
.livebar{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 16px;background:var(--cinnabar);color:var(--on-cinnabar);font-weight:500}
.livebar .mono{opacity:.9}
.livebar button{min-height:30px;padding:0 11px;border-radius:7px;font-weight:600;background:#ffffff2e}
.livebar button:hover{background:#ffffff47}
:root[data-theme=dark] .livebar button{background:#0000001f}
:root[data-theme=dark] .livebar button:hover{background:#00000038}
.livebar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;position:relative}
.body.empty{grid-template-rows:auto auto;align-content:center;overflow-y:auto;padding-bottom:6vh}
.body.has-stage{grid-template-columns:minmax(0,1fr) clamp(320px,34%,440px)}
.stage{grid-column:1;grid-row:1;min-height:0;padding:0 8px 12px 16px;display:flex;animation:stage-in .32s var(--ease)}
.conv{grid-column:1;grid-row:1;min-width:0;min-height:0;position:relative;display:flex;flex-direction:column}
.body.has-stage .conv{grid-column:2}
.bottom{grid-column:1/-1;grid-row:2;padding:0 16px calc(12px + env(safe-area-inset-bottom));min-width:0}
.bottom-in{max-width:var(--thread);margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bottom.live .bottom-in{max-width:none}

.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable;overscroll-behavior:contain}
.thread{max-width:var(--thread);margin:0 auto;padding:12px 16px 28px;display:flex;flex-direction:column;gap:22px}
.body.has-stage .thread{padding:4px 14px 16px 10px;gap:16px}
.to-latest{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:99px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:13px;z-index:3}

/* Messages */
.msg-user{align-self:flex-end;max-width:min(82%,600px);display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.msg-user .bubble{padding:9px 14px;border-radius:14px 14px 4px 14px;background:var(--user-bubble);white-space:pre-wrap;overflow-wrap:anywhere}
.msg-fail{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--cinnabar)}
.msg-fail button{text-decoration:underline;text-underline-offset:3px;font-weight:500}
.msg-ai{min-width:0;font-size:14.5px;line-height:1.75}
.msg-ai>.content p+p,.msg-ai>.content p+table,.msg-ai>.content table+p{margin-top:10px}
.msg-ai .content strong{font-weight:600}
.msg-ai table{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.6}
.msg-ai th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:6px 14px 6px 0;border-bottom:1px solid var(--line-2)}
.msg-ai td{vertical-align:top;padding:8px 14px 8px 0;border-bottom:1px solid var(--line)}
.msg-ai tr:last-child td{border-bottom:0}
.msg-ai td:first-child{font-weight:500;white-space:nowrap}
.caret::after{content:'';display:inline-block;width:7px;height:1em;margin-left:2px;vertical-align:-.14em;background:var(--jade-wave);animation:blink 1s steps(2) infinite}
.msg-tools{display:flex;align-items:center;gap:2px;margin:6px 0 0 -7px;min-height:30px;color:var(--ink-3);opacity:.0;transition:opacity .15s}
.msg-ai:hover .msg-tools,.msg-ai:focus-within .msg-tools,.msg-ai:last-child .msg-tools{opacity:1}
.msg-tools .icon-btn{width:30px;height:30px}
.msg-tools .icon-btn svg{width:16px;height:16px}
.msg-stat{margin-left:8px;font-size:12px;color:var(--ink-3)}
.steps{margin-bottom:8px;font-size:13px;color:var(--ink-2)}
.steps summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;list-style:none;padding:2px 6px 2px 0;border-radius:6px}
.steps summary::-webkit-details-marker{display:none}
.steps summary svg{width:14px;height:14px;transition:transform .15s}
.steps[open] summary svg{transform:rotate(90deg)}
.steps ol{list-style:none;margin:6px 0 0 6px;padding:0 0 0 12px;border-left:1px solid var(--line-2);display:grid;gap:3px}
.steps b{font-weight:500;color:var(--ink)}
.voice-strip{display:inline-flex;align-items:center;gap:10px;margin-bottom:8px;padding:5px 12px 5px 5px;border-radius:99px;background:var(--jade-soft);color:var(--jade)}
.voice-strip button{width:28px;height:28px;border-radius:50%;background:var(--jade);color:var(--on-jade);display:grid;place-items:center}
.voice-strip button svg{width:14px;height:14px}
.voice-strip .bars{display:flex;align-items:center;gap:2px;height:18px}
.voice-strip .bars i{width:2px;border-radius:1px;background:currentColor;opacity:.75}
.attach-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.att{display:inline-flex;align-items:center;gap:7px;max-width:260px;min-height:34px;padding:3px 10px 3px 4px;border-radius:8px;background:var(--raised);border:1px solid var(--line);font-size:13px}
.att .thumb{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;background:var(--sunken);color:var(--ink-2);background-size:cover;background-position:center;flex:none}
.att .thumb svg{width:15px;height:15px}
.att span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .sub{color:var(--ink-3);font-size:12px;white-space:nowrap}
.att button{width:24px;height:24px;margin-right:-6px;display:grid;place-items:center;border-radius:6px;color:var(--ink-3)}
.att button:hover{background:var(--sunken);color:var(--ink)}
.att button svg{width:14px;height:14px}
.note{display:flex;gap:10px;padding:11px 13px;border-radius:10px;background:var(--amber-soft);color:var(--ink);font-size:13.5px}
.note svg{color:var(--amber);margin-top:2px}
.note.bad{background:var(--cinnabar-soft)}
.note.bad svg{color:var(--cinnabar)}
.note strong{display:block;font-weight:600}
.note p{color:var(--ink-2)}
.note .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note .grow{flex:1;min-width:0}

/* Live sessions live inside the thread as one block */
.live-block{border:1px solid var(--line);border-radius:12px;background:var(--raised)}
.live-block.on{border-color:transparent;background:none}
.live-block>summary,.live-head{display:flex;align-items:center;gap:9px;padding:9px 12px;list-style:none;cursor:pointer;border-radius:12px}
.live-block>summary::-webkit-details-marker{display:none}
.live-block.on .live-head{cursor:default;padding:0 0 6px;font-size:13px;color:var(--ink-3)}
.live-head .lbl{font-weight:500;white-space:nowrap}
.live-head .mini{flex:1;min-width:30px;height:18px;display:block}
.live-head svg.chev{width:15px;height:15px;color:var(--ink-3);transition:transform .15s}
details[open]>.live-head svg.chev{transform:rotate(90deg)}
.turns{display:flex;flex-direction:column;gap:12px;padding:2px 14px 14px}
.live-block.on .turns{padding:0}
.turn{padding-left:11px;border-left:2px solid var(--line-2)}
.turn.model{border-left-color:var(--jade-wave)}
.turn-who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.turn.model .turn-who b{color:var(--jade);font-weight:600}
.turn-who b{font-weight:500}
.turn p{overflow-wrap:anywhere}
.turn-act{font-size:12px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;min-height:20px}
.turn-act:hover{color:var(--ink)}
.turn .pill{padding:0 6px;font-size:11.5px}
.live-end{margin-top:2px;font-size:12.5px;color:var(--ink-3)}

/* ---------- Composer ---------- */
.composer{position:relative;border:1px solid var(--line-2);border-radius:14px;background:var(--raised);padding:6px;box-shadow:0 1px 2px #17211D0A;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--ink-3)}
.composer .chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 6px}
.composer .att{background:var(--surface)}
.composer textarea{display:block;width:100%;min-height:42px;max-height:220px;resize:none;border:0;outline:0;background:none;padding:8px 9px 4px;line-height:1.6;font-size:14.5px}
.composer textarea::placeholder{color:var(--ink-3)}
.c-row{display:flex;align-items:center;gap:2px}
.c-gap{flex:1;min-width:6px}
.toggle{height:32px;padding:0 9px;display:inline-flex;align-items:center;gap:5px;border-radius:8px;font-size:13px;color:var(--ink-2);transition:background .15s,color .15s;white-space:nowrap}
.toggle svg{width:16px;height:16px}
.toggle:hover{background:var(--sunken)}
.toggle[aria-pressed=true]{background:var(--jade-soft);color:var(--jade)}
.model-btn{height:32px;max-width:170px;padding:0 5px 0 9px;display:inline-flex;align-items:center;gap:2px;border-radius:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.model-btn:hover,.model-btn[aria-expanded=true]{background:var(--sunken)}
.model-btn svg{width:14px;height:14px}
.model-btn .short{display:none}
.att.bad{border-color:var(--cinnabar)}
.live-btn{height:36px;padding:0 14px 0 11px;margin-left:6px;display:inline-flex;align-items:center;gap:6px;border-radius:10px;background:var(--jade);color:var(--on-jade);font-weight:600;white-space:nowrap;transition:background .15s,color .15s,padding .18s var(--ease)}
.live-btn:hover{filter:brightness(1.08)}
.live-btn svg{width:18px;height:18px}
.live-btn:disabled{background:var(--sunken);color:var(--ink-3);filter:none}
.composer.has-input .live-btn:not(:disabled){background:none;color:var(--jade);box-shadow:inset 0 0 0 1px var(--line-2);padding:0 9px}
.composer.has-input .live-btn span{display:none}
.send-btn{width:36px;height:36px;margin-left:6px;display:grid;place-items:center;border-radius:10px;background:var(--ink);color:var(--surface);transition:opacity .15s}
.send-btn:hover{opacity:.86}
.send-btn:disabled{background:var(--sunken);color:var(--ink-3);opacity:1}
.c-rec{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 6px 0 10px}
.c-rec .lamp{width:9px;height:9px;border-radius:50%;background:var(--cinnabar);animation:lamp 1.2s ease-in-out infinite}
.c-rec .meter{flex:1;display:flex;align-items:center;gap:2px;height:26px;overflow:hidden;justify-content:flex-end;min-width:0}
.c-rec .meter i{flex:none;width:2px;border-radius:1px;background:var(--ink-2)}
.drop{position:absolute;inset:6px;display:grid;place-items:center;border:2px dashed var(--jade);border-radius:12px;background:color-mix(in srgb,var(--surface) 86%,transparent);color:var(--jade);font-weight:600;font-size:16px;z-index:8;pointer-events:none}

/* ---------- Banner above the composer ---------- */
.banner{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--amber-soft);font-size:13.5px}
.banner svg{color:var(--amber)}
.banner.bad{background:var(--cinnabar-soft)}
.banner.bad svg{color:var(--cinnabar)}
.banner .txt{flex:1;min-width:0}
.banner .txt b{font-weight:600}
.banner .txt span{color:var(--ink-2)}
.banner .btn{min-height:30px;padding:0 10px;font-size:13px}

/* ---------- Empty task ---------- */
.hero{max-width:var(--thread);width:100%;margin:0 auto;padding:0 16px 20px;text-align:center}
.hero h1{font-size:26px;font-weight:600;letter-spacing:.01em;line-height:1.35}
.hero>p{margin-top:6px;color:var(--ink-2)}
.scene-row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:18px}
.scene-opt{min-height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);font-size:13px;transition:background .15s,border-color .15s}
.scene-opt:hover{background:var(--sunken)}
.scene-opt[aria-checked=true]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:500}
.starters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:2px}
.starter{display:flex;flex-direction:column;gap:3px;text-align:left;padding:11px 13px;border-radius:12px;border:1px solid var(--line);transition:background .15s,border-color .15s}
.starter:hover{background:var(--raised);border-color:var(--line-2)}
.starter svg{color:var(--jade);margin-bottom:3px}
.starter b{font-weight:500}
.starter small{font-size:12.5px;color:var(--ink-3);line-height:1.45}

/* ---------- Live stage ---------- */
.viewport{position:relative;flex:1;min-width:0;border-radius:12px;overflow:hidden;background:#0B0F0D;isolation:isolate}
.viewport::after{content:'';position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 2px var(--cinnabar);pointer-events:none;z-index:4}
.viewport.off::after{box-shadow:inset 0 0 0 1px var(--line-2)}
.corner{position:absolute;width:20px;height:20px;border:2px solid #fff;opacity:.28;z-index:3;transition:opacity .5s}
.corner.tl{left:14px;top:14px;border-right:0;border-bottom:0}.corner.tr{right:14px;top:14px;border-left:0;border-bottom:0}
.corner.bl{left:14px;bottom:14px;border-right:0;border-top:0}.corner.br{right:14px;bottom:14px;border-left:0;border-top:0}
.viewport.sample .corner{opacity:.95;transition:none}
.stage-tags{position:absolute;left:44px;right:44px;top:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:5;pointer-events:none}
.tag{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;background:#0B0F0DC7;color:#F1F4F1;font-size:12.5px;backdrop-filter:blur(8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.tag:hover{background:#0B0F0DF0}
.tag .rec{width:7px;height:7px;border-radius:50%;background:#FF6A4D;animation:lamp 1.6s ease-in-out infinite}
.paused{position:absolute;inset:0;z-index:4;display:grid;place-content:center;justify-items:center;gap:6px;background:#0B0F0DE6;color:#E8EDE8;text-align:center;padding:20px}
.paused svg{width:26px;height:26px}
.paused small{color:#A9B5AE}
/* Mock: shared window */
.mock-win{position:absolute;inset:0;display:flex;flex-direction:column;background:#10151A;color:#C9D3DC;font:13px/1.75 var(--mono)}
.mock-tabs{display:flex;align-items:flex-end;gap:2px;height:68px;padding:0 14px;background:#0C1014}
.mock-tabs span{padding:4px 14px;border-radius:6px 6px 0 0;color:#71808C;font-size:12px}
.mock-tabs span.on{background:#10151A;color:#DCE4EA}
.mock-code{flex:1;overflow:hidden;padding:14px 0}
.mock-code div{display:flex;white-space:pre;padding:0 16px}
.mock-code div i{width:40px;flex:none;color:#4B5966;font-style:normal;text-align:right;padding-right:16px;user-select:none}
.mock-code .hl{background:#E5A04B1C}
.k{color:#C792EA}.f{color:#82AAFF}.s{color:#A5D6A7}.c{color:#5F7080}.n{color:#F2B880}
/* Mock: camera */
.mock-cam{position:absolute;inset:-3%;width:106%;height:106%;animation:handheld 7s ease-in-out infinite alternate}

/* ---------- Live dock ---------- */
.dock{display:grid;grid-template-columns:auto minmax(120px,1fr) auto;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--raised);border:1px solid var(--line-2);animation:dock-in .28s var(--ease)}
.dock-status{min-width:118px;text-align:left;padding:4px 8px 4px 0;border-radius:8px}
.ds-row{display:flex;align-items:center;gap:8px}
.dock-status strong{font-weight:600;font-size:14.5px;white-space:nowrap}
.dock-status small{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);padding-left:18px;white-space:nowrap}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--ink-3);flex:none;transition:background .2s,box-shadow .2s}
.dock[data-phase=listening] .lamp{background:var(--jade-wave)}
.dock[data-phase=you] .lamp{background:var(--you-wave)}
.dock[data-phase=model] .lamp,.dock[data-phase=proactive] .lamp{background:var(--jade-wave);box-shadow:0 0 0 4px var(--jade-soft)}
.dock[data-phase=overlap] .lamp{background:var(--cinnabar);box-shadow:0 0 0 4px var(--cinnabar-soft)}
.dock[data-phase=connecting] .lamp{background:var(--amber);animation:lamp 1s ease-in-out infinite}
.tracks{position:relative;height:60px;min-width:0;border-radius:8px;background:var(--surface);overflow:hidden}
.tracks canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tracks::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line-2)}
.lane{position:absolute;left:8px;font-size:11.5px;line-height:1;color:var(--ink-3);z-index:2;padding:2px 4px;border-radius:4px;background:color-mix(in srgb,var(--surface) 82%,transparent)}
.lane.you{top:4px}.lane.me{bottom:4px;color:var(--jade)}
.dock-ctrl{display:flex;align-items:center;gap:2px}
.ctl{min-width:58px;height:52px;padding:4px 6px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:9px;font-size:12px;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.ctl svg{width:20px;height:20px}
.ctl:hover{background:var(--sunken);color:var(--ink)}
.ctl[aria-pressed=true]{background:var(--jade-soft);color:var(--jade)}
.ctl:disabled{opacity:.45}
.ctl.off{background:var(--cinnabar-soft);color:var(--cinnabar)}
.ctl.end{margin-left:6px;min-width:64px;background:var(--cinnabar);color:var(--on-cinnabar);font-weight:600}
.ctl.end:hover{filter:brightness(1.08);background:var(--cinnabar);color:var(--on-cinnabar)}
.ctl-sep{width:1px;height:28px;margin:0 3px;background:var(--line)}

/* ---------- Inspector ---------- */
.inspector{width:296px;min-height:0;overflow-y:auto;background:var(--chrome);border-left:1px solid var(--line);padding:0 14px 16px}
.ins-top{height:52px;display:flex;align-items:center;justify-content:space-between;font-weight:600;position:sticky;top:0;background:var(--chrome);z-index:1}
.ins-sec{padding:12px 0;border-top:1px solid var(--line)}
.ins-sec h3{font-size:12px;font-weight:500;color:var(--ink-3);margin-bottom:6px}
.ins-item{display:flex;align-items:center;gap:8px;min-height:30px;font-size:13.5px;min-width:0}
.ins-item svg{width:16px;height:16px;color:var(--ink-3)}
.ins-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-empty{font-size:13px;color:var(--ink-3)}
.chips-wrap{display:flex;flex-wrap:wrap;gap:5px}

/* ---------- Settings ---------- */
.settings{grid-column:2/-1;grid-row:1;z-index:7;display:grid;grid-template-columns:208px minmax(0,1fr);grid-template-rows:52px minmax(0,1fr);background:var(--surface);min-width:0}
.set-head{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.set-head .grow{flex:1}
.set-nav{padding:10px;border-right:1px solid var(--line);overflow-y:auto}
.set-nav .grp{padding:10px 10px 4px;font-size:12px;color:var(--ink-3)}
.set-nav button{display:flex;align-items:center;gap:9px;width:100%;min-height:36px;padding:0 10px;border-radius:8px;color:var(--ink-2)}
.set-nav button:hover{background:var(--sunken)}
.set-nav button[aria-current=page]{background:var(--jade-soft);color:var(--jade);font-weight:500}
.set-body{overflow-y:auto;padding:24px 32px 48px}
.set-in{max-width:680px;margin:0 auto}
.set-in h2{font-size:20px;font-weight:600}
.set-in>p{color:var(--ink-2);margin:2px 0 16px}
.set-in h3{font-size:12.5px;font-weight:500;color:var(--ink-3);margin:22px 0 2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.row>div:first-child{min-width:0}
.row b{display:block;font-weight:500}
.row small{display:block;font-size:13px;color:var(--ink-3);line-height:1.5}
.row .ctrl{flex:none;display:flex;align-items:center;gap:8px}
.row select,.row input[type=text],.row input[type=password]{height:34px;min-width:190px;max-width:100%;padding:0 9px;border-radius:8px;border:1px solid var(--line-2);background:var(--raised)}
.sw{width:40px;height:24px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:transform .15s var(--ease)}
.sw[aria-checked=true]{background:var(--jade-wave)}
.sw[aria-checked=true]::after{transform:translateX(16px)}
.voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px}
.voice{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px;text-align:left}
.voice:hover:not(:disabled){background:var(--raised)}
.voice:disabled{opacity:.5}
.voice svg{color:var(--ink-2)}
.voice[aria-checked=true]{border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade)}
.voice b{display:block;font-weight:500}
.voice small{display:block;font-size:12.5px;color:var(--ink-3)}
.set-in textarea{display:block;width:100%;min-height:92px;margin-top:8px;padding:9px 11px;resize:vertical;border:1px solid var(--line-2);border-radius:10px;background:var(--raised);line-height:1.6}

/* ---------- Menu & toast ---------- */
.menu{position:fixed;z-index:30;min-width:220px;max-width:min(340px,calc(100vw - 16px));padding:5px;border-radius:12px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow);animation:pop .14s var(--ease)}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:6px 9px;border-radius:8px;text-align:left}
.menu .mi:hover,.menu .mi:focus-visible{background:var(--sunken);outline:0}
.menu .mi b{display:block;font-weight:500}
.menu .mi small{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.4}
.menu .mi .tick{margin-left:auto;color:var(--jade)}
.menu .mi.danger{color:var(--cinnabar)}
.menu .sep{height:1px;margin:5px 4px;background:var(--line)}
.menu .ttl{padding:6px 9px 3px;font-size:12px;color:var(--ink-3)}
.stat{display:flex;justify-content:space-between;gap:24px;padding:4px 9px;font-size:13px}
.stat span:first-child{color:var(--ink-3)}
.stat.sub{padding-left:21px;font-size:12.5px}
.stat.top span:first-child{color:var(--ink);font-weight:500}
.perf-head{padding:6px 9px 8px}
.perf-head b{display:block;font-size:15px;font-weight:600}
.perf-head small{display:block;font-size:12.5px;color:var(--ink-3)}
.menu .hint{padding:6px 9px;font-size:12.5px;line-height:1.5;color:var(--ink-2);max-width:280px}
.toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 24px);padding:9px 14px;border-radius:10px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow);animation:pop .16s var(--ease)}
.toast button{font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- Motion ---------- */
@keyframes lamp{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{opacity:0;translate:0 4px}}
@keyframes stage-in{from{opacity:0;transform:scale(.985)}}
@keyframes dock-in{from{opacity:0;transform:translateY(6px)}}
@keyframes handheld{to{transform:translate(-1%,.6%) scale(1.01)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- Responsive ---------- */
@media (max-width:1320px){.ctl{min-width:50px}.dock-ctrl .ctl:not(.end) span{font-size:11.5px}}
@media (max-width:1180px){
  .inspector{position:fixed;top:0;right:0;bottom:0;z-index:22;box-shadow:var(--shadow)}
  .app.ins-open .scrim{display:block;position:fixed;inset:0;z-index:21;background:#0006}
  .dock{grid-template-columns:auto minmax(0,1fr);row-gap:6px}
  .dock-ctrl{grid-column:1/-1;justify-content:center}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .work{grid-column:1}
  .app .nav{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);z-index:22;box-shadow:var(--shadow);transform:translateX(-102%);visibility:hidden;transition:transform .22s var(--ease),visibility .22s}
  .app.nav-open .nav{transform:none;visibility:visible}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;z-index:21;background:#0006}
  .nav-resizer,.only-wide{display:none}
  .only-collapsed{display:inline-grid}
  .settings{grid-column:1;grid-template-columns:minmax(0,1fr);grid-template-rows:52px auto minmax(0,1fr)}
  .set-nav{display:flex;gap:4px;padding:8px 10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .set-nav .grp{display:none}
  .set-nav button{width:auto;flex:none;white-space:nowrap;min-height:40px}
  .set-body{padding:18px 16px 40px}
  .body.has-stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(160px,38%) minmax(0,1fr) auto}
  .stage{grid-row:1;padding:0 12px 8px}
  .body.has-stage .conv{grid-column:1;grid-row:2}
  .body.has-stage .bottom{grid-row:3}
  .body.has-stage .thread{padding:4px 12px 12px}
  .bottom{padding:0 10px calc(10px + env(safe-area-inset-bottom))}
  .thread{padding:8px 14px 20px}
  .dock{padding:8px}
  .ctl{min-width:0;flex:1;height:48px}
  .dock-ctrl{justify-content:stretch}
  .ctl-sep{display:none}
  .ctl.end{margin-left:2px}
  .tracks{height:48px}
  .icon-btn{width:40px;height:40px}
  .composer .icon-btn{width:40px;height:40px}
  .send-btn,.live-btn{height:40px}.send-btn{width:40px}
  .task-more{opacity:1;width:40px;height:40px;top:2px}
  .task-main{padding:9px 44px 9px 10px}
  .nav-new kbd,.nav-search kbd{display:none}
  .row{flex-wrap:wrap;gap:8px}
  .row .ctrl{max-width:100%}
  .starters{grid-template-columns:minmax(0,1fr)}
  .starter{flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap}
  .starter svg{margin:0}
  .starter small{display:none}
  .hero h1{font-size:22px}
  .toggle span{display:none}
  .model-btn{height:40px}
  .model-btn .full{display:none}
  .model-btn .short{display:inline}
  .toggle{width:40px;height:40px;padding:0;justify-content:center}
  .head{padding:0 6px 0 4px}
  .head-title{max-width:none;flex:0 1 auto}
  .scene-chip{display:none}
}
@media (max-width:420px){.ctl span{font-size:11px}.dock-status{min-width:96px}}
</style>
</head>

/* ================= Backend & performance =================
 * One footer slot answers "is the backend keeping up?". On-device that is the
 * machine's load; remote it is the link, because local hardware stops mattering.
 * The bar reads the same way in both: fuller means tighter. Figures are simulated. */
const HARDWARE = {
  discrete: { gpu: 'RTX 5060', vram: 8, ram: 32 },
  unified: { gpu: 'Apple M4 Pro', ram: 24 },
};
const GB = v => (v < 10 ? v.toFixed(1) : Math.round(v).toString());
const isRemote = () => state.backend === 'remote';
const remoteHost = () => { try { return new URL(state.remote.url).host; } catch { return state.remote.url; } };
const backendState = () => (isRemote() && !state.remote.url ? 'unset' : state.engine === 'offline' ? 'offline' : 'ready');
const backendReady = () => backendState() === 'ready';
const weakLink = () => isRemote() && state.proto.weak;
const usage = { gpu: 0, cpu: 0, temp: 0, parts: null, ram: 0, rtt: 0, jitter: 0, loss: 0, ready: false };
function usageTarget() {
  const off = !backendReady() || isRemote(), L = state.live;
  const video = L && L.source !== 'voice' && !L.videoOff;
  const load = off ? .02 : L ? (video ? .74 : .46) : state.reply ? .68 : .04;
  const weak = weakLink();
  return {
    gpu: load * 100, cpu: 6 + load * 26, temp: 42 + load * 30, ram: 9.4 + (L ? .5 : 0) + (video ? .4 : 0),
    parts: { weights: off ? 0 : MODELS[state.loaded].mem.weights, media: off ? 0 : MODELS[state.loaded].mem.media, kv: off ? 0 : L ? L.kv * .00012 : .15, other: state.proto.tight ? 1.05 : .4 },
    rtt: weak ? 640 : L ? 112 : 86, jitter: weak ? 150 : 9, loss: weak ? 2.4 : 0,
  };
}
function stepUsage() {
  const t = usageTarget(), k = usage.ready ? .45 : 1;
  for (const key of ['cpu', 'temp', 'ram', 'rtt', 'jitter', 'loss']) usage[key] += (t[key] - usage[key]) * k;
  const noise = usage.ready ? (Math.random() - .5) * 6 * (t.gpu > 10 ? 1 : .2) : 0;
  usage.gpu = Math.max(0, Math.min(100, usage.gpu + (t.gpu - usage.gpu) * k + noise));
  usage.parts = t.parts; usage.ready = true;
}
function memoryRows() {
  const hw = HARDWARE[state.proto.hw], sum = Object.values(usage.parts).reduce((a, b) => a + b, 0);
  const rows = hw.vram ? [['显存', sum, hw.vram], ['内存', usage.ram, hw.ram]] : [['统一内存', usage.ram - .9 + sum, hw.ram]];
  return rows.map(([name, used, total]) => ({ name, ratio: used / total, val: `${GB(used)}/${total} GB` }));
}
/* Worst resource wins: an average would hide a full VRAM behind an idle CPU.
 * Memory is scored on headroom, since resident weights make a high ratio normal. */
const memoryScore = r => (r < .85 ? r / .85 * .3 : .8 + (r - .85) * 1.2);
const grade = (score, steps) => steps.find(([limit]) => score < limit);

function backendHealth() {
  if (!backendReady() || (!isRemote() && state.proto.hw === 'none')) return null;
  const parts = isRemote()
    ? [['延迟', usage.rtt / 800], ['抖动', usage.jitter / 200], ['丢包', usage.loss / 5]]
    : [...memoryRows().map(r => [r.name, memoryScore(r.ratio)]), ['GPU', usage.gpu / 100], ['CPU', usage.cpu / 100]];
  const [cause, score] = parts.reduce((a, b) => (b[1] > a[1] ? b : a));
  const [, word, kind] = grade(score, isRemote() ? LINK_GRADES : LOAD_GRADES);
  return { label: isRemote() ? '连接质量' : '系统负载', score, word, kind, cause };
}
const footerModel = () => (isRemote() ? modelOf(cur()) : MODELS[state.loading ?? state.loaded]);
function engineStatus() {
  const st = backendState();

  if (st === 'offline') return ['bad', isRemote() ? '连不上远程服务' : '引擎未连接'];
  if (state.loading) return ['warn', '正在载入模型'];
  if (!isRemote() && !state.live && !state.reply && modelOf(cur()) !== MODELS[state.loaded]) return ['ok', `本机运行 · 发送时载入 ${modelOf(cur()).short}`];
  const activity = state.live ? '实时会话' : state.reply ? '生成中' : '空闲';
  return [backendHealth()?.kind || 'ok', `${isRemote() ? '远程' : '本机运行'} · ${activity}`];
}
function renderEngine() {

  $('#engineBtn').innerHTML = `<span class="eng-id"><span class="dot" id="engDot"></span><span style="min-width:0"><b>${esc(footerModel().name)}</b><small id="engSub"></small></span></span>

  const st = backendState(), perf = backendHealth();

  if (st === 'offline') return `<div class="hint">${isRemote() ? `${esc(remoteHost())} 没有响应。` : '本地引擎没有响应。'}检查后重试。</div>`;
  const head = perf ? `<div class="perf-head"><b>${perf.label}：${perf.word}</b><small>${perf.kind ? '主要受' : '当前最高的是'}${perf.cause}${perf.kind ? '影响' : ''}</small></div>` : '';
  if (isRemote()) {

      ${stat('上行', L ? (video ? '1.4 Mbps' : '256 kbps') : '—')}${stat('下行', L ? '190 kbps' : '—')}
      <div class="hint">${perf?.kind ? '网络较差，实时画面会自动降帧。' : '声音、画面和文字会发送到这台服务器处理。'}</div>`;

    ${mem[1] ? stat(mem[1].name, mem[1].val, 'top') : ''}${stat('CPU', `${Math.round(usage.cpu)}%`, 'top')}
    ${perf?.kind ? `<div class="hint">${perf.kind === 'bad' ? '资源快用完了，实时会话可能中断' : '响应可能变慢'}。关掉其他占用显卡的程序，或在设置里关闭“高清细节”。</div>` : ''}`;
}

let menuAnchor = null;
function openMenu(anchor, html, { label = '菜单', role = 'menu' } = {}) {
  if (menuAnchor === anchor) return closeMenu();
  closeMenu();
  const m = $('#menu');
  m.innerHTML = html; m.hidden = false; m.setAttribute('role', role); m.setAttribute('aria-label', label);
  const r = anchor.getBoundingClientRect(), mr = m.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.left, innerWidth - mr.width - 8));
  const top = r.bottom + 6 + mr.height > innerHeight - 8 ? r.top - mr.height - 6 : r.bottom + 6;
  m.style.left = `${left}px`; m.style.top = `${Math.max(8, top)}px`;
  anchor.setAttribute('aria-expanded', 'true');
  menuAnchor = anchor;
  (m.querySelector('.mi') ?? m).focus?.();
}
function closeMenu(refocus = false) {
  const m = $('#menu');
  if (m.hidden) return;
  m.hidden = true; m.innerHTML = '';
  if (menuAnchor) { menuAnchor.setAttribute('aria-expanded', 'false'); if (refocus && menuAnchor.isConnected) menuAnchor.focus(); }
  menuAnchor = null;
}

}

  renderNav(); renderHead(); renderThread(opts); renderStage(); renderDock(); renderLivebar();
  renderBanner(); renderInspector(); renderSettings(); syncComposer();
  if (liveHere()) paintLive();
}
function selectTask(id) {
  state.current = id; state.permError = null;
  const t = cur(); t.unread = false;
  $('#app').classList.remove('nav-open');
  if (innerWidth <= 1180) state.inspector = false;
  state.atts = []; $('#prompt').value = '';
  stopRecord(false);
  renderAll({ stick: true });
}
function newTask() {
  let t = tasks.find(x => isBlank(x) && x.autoTitle);
  if (!t) {
    t = { id: uid('task'), title: '新任务', autoTitle: true, scene: cur()?.scene ?? 'Work Buddy', group: '今天', meta: '刚刚', items: [], ctx: { agents: [['Core Agent', '主会话']], skills: [], sources: [], outputs: [] } };
    tasks.unshift(t);
    tasks.sort((a, b) => (a.group === b.group ? 0 : a.group === '今天' ? -1 : 1));
  }
  state.settingsTab = null;
  selectTask(t.id);
  $('#prompt').focus();
}
function deleteTask(id) {
  const i = tasks.findIndex(t => t.id === id), [t] = tasks.splice(i, 1);
  if (state.live?.taskId === id) endLive({ toast: false });
  if (!tasks.length) { state.current = null; newTask(); }
  else if (state.current === id) selectTask(tasks[Math.min(i, tasks.length - 1)].id);
  else renderNav();
  showToast(`已删除“${t.title}”`, '撤销', () => { tasks.splice(i, 0, t); renderNav(); });
}

/* ================= Actions ================= */
const actions = {
  'select-task': el => selectTask(el.dataset.id),
  'new-task': newTask,
  'toggle-nav': () => {
    if (innerWidth <= 820) $('#app').classList.toggle('nav-open');
    else $('#app').classList.toggle('nav-collapsed');
  },
  'close-drawers': () => { $('#app').classList.remove('nav-open'); state.inspector = false; renderInspector(); renderHead(); },
  'toggle-inspector': () => { state.inspector = !state.inspector; renderInspector(); renderHead(); },
  rename: () => startRename(),
  'task-menu': el => openMenu(el, mi('rename-id', '重命名', { data: `data-id="${el.dataset.id}"` }) + mi('delete-task', '删除', { data: `data-id="${el.dataset.id}"`, danger: true }), { label: '任务操作' }),
  'rename-id': el => startRename(el.dataset.id),
  'delete-task': el => deleteTask(el.dataset.id),
  'scene-menu': el => openMenu(el, Object.keys(SCENES).map(s => mi('set-scene', s, { sub: SCENES[s].hint, data: `data-scene="${s}"`, tick: s === cur().scene, role: 'menuitemradio' })).join(''), { label: '应用场景' }),
  'set-scene': el => { cur().scene = el.dataset.scene; renderAll(); },
  'use-prompt': el => { $('#prompt').value = el.dataset.prompt; syncComposer(); $('#prompt').focus(); },
  'proto-menu': el => openMenu(el, `<div class="ttl">切换到这些状态来评审</div>
    ${mi('proto-engine', '后端离线', { tick: state.engine === 'offline', role: 'menuitemcheckbox' })}
    ${mi('proto-perm', '设备权限被拒绝', { tick: state.proto.perm === 'denied', role: 'menuitemcheckbox' })}
    ${isRemote() ? mi('proto-weak', '网络不稳（实时降帧）', { tick: state.proto.weak, role: 'menuitemcheckbox' }) : `
    <div class="sep"></div><div class="ttl">设备</div>
    ${mi('proto-tight', '显存紧张', { tick: state.proto.tight, role: 'menuitemcheckbox' })}
    ${mi('proto-hw', '独立显卡', { data: 'data-hw="discrete"', tick: state.proto.hw === 'discrete', role: 'menuitemradio' })}
    ${mi('proto-hw', '统一内存（Apple 芯片）', { data: 'data-hw="unified"', tick: state.proto.hw === 'unified', role: 'menuitemradio' })}
    ${mi('proto-hw', '网页端读不到硬件', { data: 'data-hw="none"', tick: state.proto.hw === 'none', role: 'menuitemradio' })}`}`, { label: '原型状态' }),
  'proto-engine': () => {
    state.engine = state.engine === 'offline' ? 'ready' : 'offline';
    if (state.engine === 'offline' && state.live) endLive({ note: '连接中断，已保留到此为止的转写。', toast: false });
    renderAll();
  },
  'proto-perm': () => { state.proto.perm = state.proto.perm === 'denied' ? 'granted' : 'denied'; state.permError = null; renderBanner(); },
  'proto-tight': () => { state.proto.tight = !state.proto.tight; stepUsage(); renderEngine(); },
  'proto-hw': el => { state.proto.hw = el.dataset.hw; renderEngine(); },
  'proto-weak': () => { state.proto.weak = !state.proto.weak; stepUsage(); paintUsage(); renderStage(); syncPresence(); },
  reconnect: () => { showToast('正在重新连接…'); setTimeout(() => { state.engine = 'ready'; renderAll(); showToast(isRemote() ? '已连接远程服务' : '已连接本地引擎'); }, 700); },
  'open-settings': el => { state.settingsTab = el.dataset.tab || 'general'; $('#app').classList.remove('nav-open'); renderSettings(); $('.set-nav [aria-current]')?.focus(); },
  'settings-tab': el => { state.settingsTab = el.dataset.tab; renderSettings(); $('.set-body').scrollTop = 0; $('.set-nav [aria-current]')?.focus(); },
  'close-settings': () => { state.settingsTab = null; renderSettings(); },
  pref: el => { const k = el.dataset.key; state.prefs[k] = !state.prefs[k]; el.setAttribute('aria-checked', state.prefs[k]); },
  'set-voice': el => { state.voice = el.dataset.id; renderSettings(); $(`.voice[data-id=${state.voice}]`).focus(); },
  'model-menu': el => openMenu(el, `<div class="ttl">这个任务使用的模型</div>${Object.entries(MODELS).map(([id, m]) => {
    const missing = !isRemote() && !state.installed.has(id);
    return mi(missing ? 'open-settings' : 'set-model', m.name, { sub: missing ? '未下载，去设置里下载' : `${m.kind} · ${capsText(m)}`, data: missing ? 'data-tab="models"' : `data-id="${id}"`, tick: id === (cur().model ?? state.defaultModel), role: 'menuitemradio' });
  }).join('')}<div class="sep"></div>${mi('open-settings', '管理模型', { data: 'data-tab="models"' })}`, { label: '选择模型' }),
  'set-model': el => setModel(el.dataset.id),
  'default-model': el => { state.defaultModel = el.dataset.id; renderAll(); },
  'download-model': el => {
    const id = el.dataset.id;
    el.disabled = true; el.textContent = '下载中…';
    setTimeout(() => { state.installed.add(id); renderSettings(); showToast(`${MODELS[id].name} 已下载`); }, 1200);
  },
  'set-backend': el => {
    if (state.backend === el.dataset.id) return;
    state.backend = el.dataset.id; store.set('backend', state.backend);
    usage.ready = false;
    renderAll();
    $(`[data-action=set-backend][data-id=${state.backend}]`)?.focus();
    if (backendReady()) showToast(`已切换到${isRemote() ? '远程' : '端侧'}，下一条消息生效`);
  },
  'test-engine': () => {
    if (isRemote() && !state.remote.url) return showToast('先填写服务地址');
    if (!isRemote()) state.address = $('#engineAddr').value.trim() || state.address;
    const where = isRemote() ? remoteHost() : state.address;
    showToast(state.engine === 'offline' ? `${where} 没有响应` : `已连接 ${where} · ${isRemote() ? 86 : 18} ms`);
    renderAll();
  },
  attach: () => $('#file').click(),
  'remove-att': el => { state.atts = state.atts.filter(a => a.id !== el.dataset.id); syncComposer(); },
  record: startRecord,
  'record-cancel': () => stopRecord(false),
  'record-done': () => stopRecord(true),
  'toggle-voice-reply': () => { state.voiceReply = !state.voiceReply; syncComposer(); },
  'toggle-thinking': () => { state.thinking = !state.thinking; syncComposer(); },
  'retry-send': el => {
    if (!backendReady()) return showToast(isRemote() ? '远程服务还没有连上' : '引擎还没有连上');
    const t = cur(), it = t.items.find(x => x.id === el.dataset.id);
    it.failed = false; renderThread(); loadModel(t, () => startReply(t));
  },
  copy: async el => {
    const text = el.closest('.msg-ai').querySelector('.content').innerText;
    try { await navigator.clipboard.writeText(text); showToast('已复制'); } catch { showToast('无法写入剪贴板，请手动选择文字'); }
  },
  regen: el => {
    const t = cur(), node = el.closest('.msg-ai');
    const idx = [...$('#thread').children].indexOf(node);
    t.items.splice(idx, 1);
    renderThread();
    startReply(t);
  },
  'read-aloud': () => showToast('原型中不播放声音'),
  'play-voice': () => showToast('原型中不播放声音'),
  'to-latest': () => { scroller().scrollTo({ top: scroller().scrollHeight, behavior: reduceMotion.matches ? 'auto' : 'smooth' }); },
  'toast-undo': () => { $('#toast').hidden = true; toastUndo?.(); },
  'dismiss-perm': () => { state.permError = null; renderBanner(); $('#prompt').focus(); },

  'live-menu': el => sourceMenu(el),
  'source-menu': el => sourceMenu(el),
  'start-live': el => startLive(el.dataset.source),
  'live-return': () => selectTask(state.live.taskId),
  resources: el => openMenu(el, `<div class="ttl">${isRemote() ? '远程服务' : '这台设备'}</div><div id="resRows">${resourceDetail()}</div><div class="sep"></div>${mi('open-settings', '模型与运行位置', { data: 'data-tab="models"' })}`, { label: '本机资源', role: 'dialog' }),
  'set-level': el => { state.live.level = el.dataset.level; repaintTurns(); showToast(`主动提醒：${PROACTIVE[el.dataset.level].label}`); },
  'less-proactive': el => {
    const L = state.live, was = L.level, turn = L.item.turns.find(t => t.id === el.dataset.id);
    L.level = was === 'high' ? 'low' : 'off';
    turn.lowered = true; repaintTurns();
    showToast(`主动提醒已调到“${PROACTIVE[L.level].label}”`, '撤销', () => { if (state.live === L) { L.level = was; turn.lowered = false; repaintTurns(); } });
  },
  'live-end': () => endLive(),
  'live-mute': () => { const L = state.live; L.muted = !L.muted; renderDock(); say(L.muted ? '麦克风已关闭' : '麦克风已打开'); },
  'live-video': () => { const L = state.live; L.videoOff = !L.videoOff; renderStage(); renderDock(); say(L.videoOff ? '画面已暂停' : '画面已恢复'); },
  'live-hush': () => {
    const L = state.live;
    L.hush = !L.hush;
    if (L.hush) for (const a of L.active.filter(x => x.who === 'model')) finishTurn(L, a, 'hush');
    renderDock();
  },
  'live-freeze': () => {
    const L = state.live, at = clock(L.clock), t = task(L.taskId), src = L.source;
    endLive({ note: `在 ${at} 定格了一帧。后续回答会参考这段记录。`, toast: false });
    state.atts.push({ id: uid('a'), kind: 'frame', name: '定格画面', sub: at });
    t.ctx.sources.push(`定格画面 ${at}`);
    renderInspector(); syncComposer(); $('#prompt').focus();
    showToast('已定格，写下你的问题', '回到实时', () => { state.atts = []; syncComposer(); startLive(src); });
  },
  'live-to-text': () => {
    const L = state.live, src = L.source, id = L.taskId, at = clock(L.clock);
    const hasFrame = src !== 'voice' && !L.videoOff;
    endLive({ note: `转为文字继续。后续回答会参考这段记录${hasFrame ? '，第一条消息会带上最后画面' : ''}。`, toast: false });
    if (hasFrame) state.atts.push({ id: uid('a'), kind: 'frame', name: '最后画面', sub: at });
    syncComposer(); $('#prompt').focus();
    showToast('已转为文字', '回到实时', () => { state.atts = []; selectTask(id); startLive(src); });
  },
  'live-stats': el => {
    const L = state.live, weak = weakLink(), video = L.source !== 'voice' && !L.videoOff;
    const stat = (k, v) => `<div class="stat"><span>${k}</span><span class="mono">${v}</span></div>`;
    openMenu(el, `<div class="ttl">链路状态</div>
      ${stat('麦克风', L.muted ? '已静音' : '采集中')}${stat('画面', video ? (weak ? '0.5 帧/秒' : '1 帧/秒') : '未发送')}
      ${stat('响应延迟', weak ? '1.4 s' : '420 ms')}${stat('上下文', `${L.kv.toLocaleString()} tokens`)}${stat('已压住的提醒', `${L.held} 次`)}
      <div class="sep"></div><div class="ttl">主动提醒</div>
      ${Object.entries(PROACTIVE).map(([k, v]) => mi('set-level', v.label, { sub: v.sub, data: `data-level="${k}"`, tick: L.level === k, role: 'radio' })).join('')}`, { label: '链路状态', role: 'dialog' });
    $('#menu').tabIndex = -1; $('#menu').focus();
  },
};

/* ================= Events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  const inMenu = e.target.closest('#menu');
  if (!el) { if (!inMenu) closeMenu(); return; }
  const keepOpen = el === menuAnchor;
  if (!keepOpen && (inMenu || !el.hasAttribute('aria-haspopup'))) closeMenu();
  actions[el.dataset.action]?.(el, e);
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'setTheme') { state.theme = e.target.value; store.set('theme', state.theme); applyTheme(); }
  if (id === 'remoteUrl') { state.remote.url = e.target.value.trim(); store.set('remoteUrl', state.remote.url); usage.ready = false; renderNav(); renderBanner(); syncComposer(); }
  if (id === 'remoteToken') { state.remote.hasToken = !!e.target.value; e.target.value = ''; e.target.placeholder = state.remote.hasToken ? '已保存' : '未设置'; }
  if (id === 'setProactive') state.prefs.proactiveDefault = e.target.value;
  if (id === 'setSend') { state.sendKey = e.target.value; store.set('sendKey', state.sendKey); syncComposer(); }
  if (id === 'file') { addFiles(e.target.files); e.target.value = ''; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'persona') state.persona = e.target.value;
});
$('#search').addEventListener('input', renderNav);
$('#prompt').addEventListener('input', syncComposer);
$('#prompt').addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229 || e.key !== 'Enter') return;
  const mod = e.metaKey || e.ctrlKey;
  if (state.sendKey === 'enter' ? !e.shiftKey : mod) { e.preventDefault(); send(); }
});
$('#prompt').addEventListener('paste', e => { if (e.clipboardData.files.length) { e.preventDefault(); addFiles(e.clipboardData.files); } });
$('#composer').addEventListener('submit', e => { e.preventDefault(); send(); });
$('#scroll').addEventListener('scroll', syncScrollUI, { passive: true });

let dragDepth = 0;
const hasFiles = e => e.dataTransfer?.types.includes('Files');
addEventListener('dragenter', e => { if (hasFiles(e) && !liveHere()) { dragDepth++; $('#drop').hidden = false; } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; $('#drop').hidden = true; if (!liveHere()) addFiles(e.dataTransfer.files); });

/* Arrow keys inside menus */
$('#menu').addEventListener('keydown', e => {
  const items = [...$('#menu').querySelectorAll('.mi')];
  const i = items.indexOf(document.activeElement);
  const go = n => { e.preventDefault(); items[(n + items.length) % items.length]?.focus(); };
  if (e.key === 'ArrowDown') go(i + 1);
  if (e.key === 'ArrowUp') go(i - 1);
  if (e.key === 'Home') go(0);
  if (e.key === 'End') go(items.length - 1);
  if (e.key === 'Tab') closeMenu();
});
document.addEventListener('keydown', e => {
  if (e.isComposing) return;
  const mod = e.metaKey || e.ctrlKey, key = e.key.toLowerCase();
  if (e.key === 'Escape') {
    if (!$('#menu').hidden) return closeMenu(true);
    if (state.recording) return stopRecord(false);
    if (state.reply?.taskId === state.current) return stopReply();
    if (state.settingsTab) return actions['close-settings']();
    if ($('#app').classList.contains('nav-open') || (state.inspector && innerWidth <= 1180)) return actions['close-drawers']();
    return;
  }
  if (mod && key === 'k') { e.preventDefault(); if ($('#app').classList.contains('nav-collapsed')) actions['toggle-nav'](); if (innerWidth <= 820) $('#app').classList.add('nav-open'); $('#search').focus(); }
  if (mod && key === 'n') { e.preventDefault(); newTask(); }
  if (mod && key === 'b') { e.preventDefault(); actions['toggle-nav'](); }
  if (mod && key === 'i') { e.preventDefault(); actions['toggle-inspector'](); }
  if (mod && e.key === ',') { e.preventDefault(); state.settingsTab = 'general'; renderSettings(); }
  if (e.altKey && liveHere()) {
    const map = { KeyM: 'live-mute', KeyH: 'live-hush' };
    if (state.live.source !== 'voice') Object.assign(map, { KeyV: 'live-video', KeyF: 'live-freeze' });
    if (map[e.code]) { e.preventDefault(); actions[map[e.code]](); }
  }
});
addEventListener('resize', () => { closeMenu(); });

/* Task bar width */
(function initResizer() {
  const r = $('#resizer'), app = $('#app');
  const max = () => Math.max(208, Math.min(420, app.clientWidth - 520));
  const set = (v, save) => {
    const w = Math.round(Math.max(208, Math.min(max(), v)));
    document.documentElement.style.setProperty('--nav-w', `${w}px`);
    r.setAttribute('aria-valuenow', w);
    if (save) store.set('navWidth', w);
  };
  let drag = null;
  r.addEventListener('pointerdown', e => { e.preventDefault(); drag = { x: e.clientX, w: $('.nav').offsetWidth }; r.setPointerCapture(e.pointerId); r.classList.add('drag'); });
  r.addEventListener('pointermove', e => { if (drag) set(drag.w + e.clientX - drag.x); });
  const stop = () => { if (!drag) return; drag = null; r.classList.remove('drag'); set(+r.getAttribute('aria-valuenow'), true); };
  r.addEventListener('pointerup', stop); r.addEventListener('pointercancel', stop);
  r.addEventListener('dblclick', () => set(264, true));
  r.addEventListener('keydown', e => {
    const v = +r.getAttribute('aria-valuenow'), d = e.shiftKey ? 48 : 12;
    const next = { ArrowLeft: v - d, ArrowRight: v + d, Home: 208, End: max() }[e.key];
    if (next !== undefined) { e.preventDefault(); set(next, true); }
  });
  set(+store.get('navWidth', 264));
})();

/* ================= Boot =================
 * Query params open any state directly, for review and screenshots:
 * ?task=screen  ?live=screen|camera|voice&t=11  ?view=empty  ?settings=voice
 * ?theme=dark  ?engine=offline  ?perm=denied  ?net=weak  ?inspector=1
 * ?proactive=off|low|high  ?hw=discrete|unified|none  ?mem=tight
 * ?backend=remote  ?backend=remote&remote=empty  ?model=minicpm-v-4.6 */
document.querySelectorAll('kbd[data-mod]').forEach(k => { k.textContent = MOD + k.dataset.mod; });
{
  const q = new URLSearchParams(location.search);
  if (q.get('theme')) state.theme = q.get('theme');
  applyTheme();
  if (q.get('engine') === 'offline') state.engine = 'offline';
  if (q.get('perm') === 'denied') state.proto.perm = 'denied';
  if (q.get('net') === 'weak') state.proto.weak = true;
  if (q.get('backend')) {
    state.backend = q.get('backend');
    if (q.get('backend') === 'remote' && q.get('remote') !== 'empty') { state.remote.url = 'wss://gpu.example.com/omni'; state.remote.hasToken = true; }
  }
  if (q.get('hw')) state.proto.hw = q.get('hw');
  if (MODELS[q.get('model')]) { state.defaultModel = q.get('model'); state.loaded = q.get('model'); }
  if (q.get('mem') === 'tight') state.proto.tight = true;
  if (PROACTIVE[q.get('proactive')]) state.prefs.proactiveDefault = q.get('proactive');
  if (q.get('inspector')) state.inspector = true;
  else if (innerWidth >= 1560) state.inspector = true;
  if (task(q.get('task'))) state.current = q.get('task');
  if (q.get('settings')) state.settingsTab = q.get('settings');
  renderAll({ stick: true });
  if (q.get('view') === 'empty') newTask();
  if (q.get('live')) {
    if (!q.get('task') && q.get('view') !== 'empty') { newTask(); }
    startLive(q.get('live'));
    if (q.get('t') && state.live) fastForward(+q.get('t'));
  }
}
